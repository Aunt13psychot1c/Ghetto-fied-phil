<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ghetto-Fied Phil</title>
  <link rel="icon" href="images/phil.jpg" type="image/jpeg" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="phone">
    <header class="game-header">
      <h1>GHETTO-FIED PHIL 🎲</h1>
      <span class="sub">PHIL'S STREET DICE</span>
    </header>

    <section class="panel">
      <div class="roll" id="rollText">2 + 1 = 3</div>
      <div class="dice-emoji" id="diceEmoji">🎲 🎲</div>
      <div class="point" id="pointText">Point: 8</div>
    </section>

    <p class="phil-line" id="philLine">Phil: Keep shootin'! Point is 8.</p>

    <div class="cash" id="cashText">Your virtual cash 💵 $100</div>

    <p class="pockets-note">Ya played Phil, better check your pockets before you leave!!</p>

    <div class="bet">
      <span class="bet-label" id="betText">Bet: $30 in play money</span>
      <input type="range" id="betSlider" min="10" max="100" step="5" value="30" />
    </div>

    <button class="shoot-btn" id="shootBtn">🎲 SHOOT THE DICE!</button>

    <footer class="game-footer">💰 Virtual cash only.</footer>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
